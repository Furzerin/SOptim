[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soptim"
version = "0.1.0"
description = "Infrastructure-level acceleration for Spiking Neural Networks in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
cpu = ["numba>=0.59"]
examples = ["torchvision>=0.16"]
parallel = ["torch>=2.5"]
dev = ["pytest", "torchvision>=0.16", "numba>=0.59"]

[tool.setuptools.packages.find]
where = ["src"]
